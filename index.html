<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d26">
  <title>The Lord</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #080f14; color: #f0f2e9; font: 14px system-ui, sans-serif; }
    body { height: 100dvh; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    main { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
    main:fullscreen { width: 100vw; height: 100dvh; background: #080f14; }
    main.is-expanded { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 10; background: #080f14; }
    #stage { position: absolute; background: #101d26; }
    canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; touch-action: none; }
    #view-controls { position: absolute; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); z-index: 2; display: flex; flex-direction: row; align-items: flex-end; gap: 12px; }
    #view-controls button { display: grid; place-items: center; width: 36px; min-width: 36px; height: 36px; padding: 0; background: #101d26dd; font-size: 20px; }
    #view-controls[hidden] { display: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 20px; text-align: center; background: #101d26; }
    #loading[hidden] { display: none; }
    #loading strong { color: #e6c581; font-size: 32px; letter-spacing: .12em; }
    progress { width: 240px; height: 8px; accent-color: #76c7b8; }
    #message { color: #9eb0af; max-width: 320px; line-height: 1.6; }
    footer { min-height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px max(12px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); border-top: 1px solid #273b43; color: #bbc9c5; }
    footer small { font-size: 12px; line-height: 1.5; }
    footer button { min-height: 36px; flex-shrink: 0; }
    @media (max-width: 600px) and (orientation: portrait) {
      footer { flex-wrap: wrap; }
      footer small { order: 3; width: 100%; text-align: center; }
      footer small::before { content: '가로 화면을 권장합니다. '; }
    }
    footer span { color: #e6c581; letter-spacing: .12em; }
    button { background: transparent; color: #e3e8dd; border: 1px solid #3b5157; padding: 4px 12px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .4; cursor: default; }
    button:hover:not(:disabled) { border-color: #e6c581; }
  </style>
</head>
<body>
  <main id="game-view">
    <div id="stage">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="The Lord 게임 화면"></canvas>
      <div id="loading" role="status" aria-live="polite">
        <strong>THE LORD</strong>
        <progress id="progress" max="1" value="0" aria-label="게임 불러오기"></progress>
        <div id="message">게임을 불러오는 중입니다.</div>
      </div>
    </div>
    <div id="view-controls" hidden>
      <button id="rotate-screen" type="button" disabled aria-label="화면 회전" title="화면을 90도 회전">↻</button>
      <button id="exit-fullscreen" type="button" aria-label="전체 화면 해제" title="전체 화면 해제">×</button>
    </div>
  </main>
  <footer><span>THE LORD</span><small>작은 글자는 길게 눌러 크게 볼 수 있습니다.</small><button id="fullscreen" type="button" disabled>전체 화면</button></footer>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const message = document.getElementById('message');
    const fullscreen = document.getElementById('fullscreen');
    const view = document.getElementById('game-view');
    const stage = document.getElementById('stage');
    const exitFullscreen = document.getElementById('exit-fullscreen');
    const rotateScreen = document.getElementById('rotate-screen');
    const viewControls = document.getElementById('view-controls');
    const gameWidth = canvas.width;
    const gameHeight = canvas.height;
    let expanded = false;
    let quarterTurns = 0;
    let gameInstance;
    let displayReady = false;
    function isFullscreen() {
      return expanded || (document.fullscreenElement || document.webkitFullscreenElement) === view;
    }
    function applyRotation(turns) {
      quarterTurns = (turns + 4) % 4;
      gameInstance?.SendMessage('TheLordWebDisplay', 'SetRotation', quarterTurns);
      const sideways = quarterTurns % 2 !== 0;
      view.dataset.rotation = quarterTurns * 90;
      rotateScreen.setAttribute('aria-label', '화면을 90도 회전, 현재 ' + quarterTurns * 90 + '도');
    }
    // Fit both page and fullscreen views. Rasterize at the displayed size so the
    // browser never downsamples a reference-resolution bitmap font.
    function fitStage() {
      const active = isFullscreen();
      if (!active && quarterTurns !== 0) applyRotation(0);
      const sideways = quarterTurns % 2 !== 0;
      const aspect = sideways ? gameHeight / gameWidth : gameWidth / gameHeight;
      const safe = getComputedStyle(view);
      const availableWidth = Math.max(1, view.clientWidth - parseFloat(safe.paddingLeft) - parseFloat(safe.paddingRight));
      const availableHeight = Math.max(1, view.clientHeight - parseFloat(safe.paddingTop) - parseFloat(safe.paddingBottom));
      const width = Math.min(availableWidth, availableHeight * aspect, active ? Infinity : gameWidth);
      const height = width / aspect;
      const renderWidth = Math.max(1, Math.round(width));
      const renderHeight = Math.max(1, Math.round(height));
      stage.style.width = renderWidth + 'px';
      stage.style.height = renderHeight + 'px';
      stage.style.left = Math.max(0, Math.floor((view.clientWidth - renderWidth) / 2)) + 'px';
      stage.style.top = Math.max(0, Math.floor((view.clientHeight - renderHeight) / 2)) + 'px';
      if (canvas.width !== renderWidth) canvas.width = renderWidth;
      if (canvas.height !== renderHeight) canvas.height = renderHeight;
      viewControls.hidden = !active;
    }
    async function enterFullscreen() {
      const request = view.requestFullscreen || view.webkitRequestFullscreen;
      let nativeFullscreen = false;
      if (request) {
        try {
          await request.call(view, { navigationUI: 'hide' });
          nativeFullscreen = (document.fullscreenElement || document.webkitFullscreenElement) === view;
        } catch (error) { console.info('Using expanded game view:', error.name); }
      }
      // Browsers without element fullscreen can still play in a fitted, page-filling view.
      if (!nativeFullscreen) {
        expanded = true;
        view.classList.add('is-expanded');
      }
      fitStage();
      canvas.focus();
    }
    async function leaveFullscreen() {
      expanded = false;
      view.classList.remove('is-expanded');
      const leave = document.exitFullscreen || document.webkitExitFullscreen;
      if (leave && (document.fullscreenElement || document.webkitFullscreenElement) === view) {
        try { await leave.call(document); } catch (error) { console.warn('Fullscreen exit failed:', error); }
      }
      fitStage();
      canvas.focus();
    }
    function fullscreenChanged() {
      fitStage();
    }
    new ResizeObserver(fitStage).observe(view);
    document.addEventListener('fullscreenchange', fullscreenChanged);
    document.addEventListener('webkitfullscreenchange', fullscreenChanged);
    screen.orientation?.addEventListener?.('change', fitStage);
    window.visualViewport?.addEventListener('resize', fitStage);
    exitFullscreen.addEventListener('click', leaveFullscreen);
    rotateScreen.addEventListener('click', () => {
      if (!isFullscreen() || !gameInstance || !displayReady) return;
      applyRotation(quarterTurns + 1);
      fitStage();
      canvas.focus();
    });
    window.addEventListener('lord-display-ready', () => {
      displayReady = true;
      rotateScreen.disabled = !gameInstance;
    });
    document.addEventListener('keydown', event => {
      if (expanded && event.key === 'Escape') { leaveFullscreen(); event.preventDefault(); }
    });
    fitStage();
    function failed(error) {
      console.error(error);
      loading.hidden = false;
      progress.hidden = true;
      message.textContent = '게임을 불러오지 못했습니다. 새로고침해 주세요.';
    }
    if (typeof createUnityInstance !== 'function') {
      failed('Unity loader was not loaded. Serve the whole build folder over HTTP.');
    } else {
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: 'Build/WebGL.data.unityweb',
        frameworkUrl: 'Build/WebGL.framework.js.unityweb',
        codeUrl: 'Build/WebGL.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "DefaultCompany",
        productName: "The Lord",
        productVersion: "0.1.0",
        devicePixelRatio: 1,
        matchWebGLToCanvasSize: false,
        showBanner: (text, type) => { if (type === 'error') failed(text); else console.warn(text); }
      }, value => { progress.value = value; }).then(instance => {
        gameInstance = instance;
        rotateScreen.disabled = !displayReady;
        loading.hidden = true;
        fullscreen.disabled = false;
        fullscreen.addEventListener('click', enterFullscreen);
        canvas.focus();
      }).catch(failed);
    }
  </script>
</body>
</html>
